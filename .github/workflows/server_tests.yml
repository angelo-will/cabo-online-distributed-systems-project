name: Server Tests

on:
  push:
    branches:
      - develop
    paths:
      - 'cabo-server/**'
      - 'cabo-commons/**'
      - 'build.sbt'
      - 'project/**'
      - '.github/workflows/server_tests.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'cabo-server/**'
      - 'cabo-commons/**'
      - 'build.sbt'
      - 'project/**'
      - '.github/workflows/server_tests.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Build and Test Server Module

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache sbt
        uses: actions/cache@v3
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: "Build: Server"
        run: sbt "project server" compile

      - name: "Test: Server Actor Logic"
        run: sbt "project server" "testOnly ServerTest"