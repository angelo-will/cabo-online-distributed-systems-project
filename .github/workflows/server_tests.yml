name: Scala Tests

on:
  push:
    branches:
      - test-actions
      - feature/add_github_actions
      - feature/distribuited_data_for_server
  pull_request:
    branches:
      - test-actions
      - feature/add_github_actions
      - feature/distribuited_data_for_server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Build and Test
        run: sbt +test