name: Actor Player Tests

on:
  push:
    branches:
      - develop
      - fix/ci-akka
    paths:
      - 'cabo-client/**'
      - 'cabo-commons/**'
      - 'build.sbt'
      - 'project/**'
      - '.github/workflows/actors_player_test.yml'
  pull_request:
    branches:
      - develop
      - fix/ci-akka
    paths:
      - 'cabo-client/**'
      - 'cabo-commons/**'
      - 'build.sbt'
      - 'project/**'
      - '.github/workflows/actors_player_test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Sicurezza per evitare loop infiniti

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # --- INIZIO NUOVO BLOCCO CACHE ---
      - name: Cache sbt
        uses: actions/cache@v3
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      # --- FINE NUOVO BLOCCO CACHE ---

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Build and Test Client
        # Esegue i test solo sul progetto 'client' e le sue dipendenze
        run: sbt "project client" test