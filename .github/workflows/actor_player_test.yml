name: Actor Player Tests

on:
  push:
    branches:
      - develop
      - feature/creation_player_actor
  pull_request:
    branches:
      - develop
      - feature/creation_player_actor

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1

      - name: Build and Test
        run: sbt client/test